global:
  scrape_interval:     30s   # BF03 : collecte toutes les 30 secondes
  evaluation_interval: 30s
  scrape_timeout:      10s

scrape_configs:

  # ── Prometheus lui-même ───────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── Node Exporter — métriques système hôte ───────────
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "serveur_hote"

  # ── Backend FastAPI ───────────────────────────────────
  - job_name: "backend_fastapi"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"

